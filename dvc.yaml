stages:
  ingest:
    cmd: python -m fraud.data.ingest
    params:
      - ingest
    outs:
      - data/raw/sparkov
  clean:
    cmd: python -m fraud.data.clean
    deps:
      - data/raw/sparkov
      - src/fraud/data/clean.py
      - src/fraud/data/schemas.py
    params:
      - ingest.expected_files
      - clean
    outs:
      - data/interim/transactions.parquet
  split:
    cmd: python -m fraud.data.split
    deps:
      - data/interim/transactions.parquet
      - src/fraud/data/split.py
    params:
      - split
    outs:
      - data/processed
    metrics:
      - reports/split_summary.json:
          cache: false
  features:
    cmd: python -m fraud.features.build
    deps:
      # Train and valid only: the test split is never an input before Phase 3, step 5.
      - data/processed/train.parquet
      - data/processed/valid.parquet
      - src/fraud/features/__init__.py
      - src/fraud/features/transformers.py
      - src/fraud/features/history.py
      - src/fraud/features/pipeline.py
      - src/fraud/features/build.py
    params:
      - features
    outs:
      - reports/feature_list_v1.json:
          cache: false
      - reports/feature_list_v2.json:
          cache: false
    metrics:
      - reports/features_summary.json:
          cache: false
