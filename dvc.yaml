stages:
  ingest:
    cmd: python -m fraud.data.ingest
    params:
      - ingest
    outs:
      - data/raw/sparkov
  clean:
    cmd: python -m fraud.data.clean
    deps:
      - data/raw/sparkov
      - src/fraud/data/clean.py
      - src/fraud/data/schemas.py
    params:
      - ingest.expected_files
      - clean
    outs:
      - data/interim/transactions.parquet
  split:
    cmd: python -m fraud.data.split
    deps:
      - data/interim/transactions.parquet
      - src/fraud/data/split.py
    params:
      - split
    outs:
      - data/processed
    metrics:
      - reports/split_summary.json:
          cache: false
  features:
    cmd: python -m fraud.features.build
    deps:
      # Train and valid only: the test split is never an input before Phase 3, step 5.
      - data/processed/train.parquet
      - data/processed/valid.parquet
      - src/fraud/features/__init__.py
      - src/fraud/features/transformers.py
      - src/fraud/features/history.py
      - src/fraud/features/pipeline.py
      - src/fraud/features/build.py
    params:
      - features
    outs:
      - reports/feature_list_v1.json:
          cache: false
      - reports/feature_list_v2.json:
          cache: false
    metrics:
      - reports/features_summary.json:
          cache: false
  train:
    cmd: python -m fraud.models.train
    deps:
      # Train and valid only: the test split is never touched before Phase 3, step 5.
      - data/processed/train.parquet
      - data/processed/valid.parquet
      - src/fraud/features/__init__.py
      - src/fraud/features/transformers.py
      - src/fraud/features/history.py
      - src/fraud/features/pipeline.py
      - src/fraud/models/metrics.py
      - src/fraud/models/calibrate.py
      - src/fraud/models/estimator.py
      - src/fraud/models/ladder.py
      - src/fraud/models/train.py
    params:
      - seed
      - features
      - model
    outs:
      - data/models/pipeline.joblib
    metrics:
      - reports/train_metrics.json:
          cache: false
  train_demo:
    # The v1 stateless model the Phase 4 demo serves (params.yaml `demo_model`).
    cmd: python -m fraud.models.train --section demo_model
    deps:
      # Train and valid only: the test split is never touched before Phase 3, step 5.
      - data/processed/train.parquet
      - data/processed/valid.parquet
      - src/fraud/features/__init__.py
      - src/fraud/features/transformers.py
      - src/fraud/features/history.py
      - src/fraud/features/pipeline.py
      - src/fraud/models/metrics.py
      - src/fraud/models/calibrate.py
      - src/fraud/models/estimator.py
      - src/fraud/models/ladder.py
      - src/fraud/models/train.py
    params:
      - seed
      - features
      - demo_model
    outs:
      - data/models/demo_pipeline.joblib
    metrics:
      - reports/train_metrics_demo.json:
          cache: false
  monitoring_reference:
    # Drift reference for the nightly job: a validation sample plus the alert baselines.
    cmd: python -m fraud.monitoring.reference
    deps:
      - data/processed/valid.parquet
      - reports/train_metrics.json
      - reports/test_evaluation.json
      - src/fraud/monitoring/reference.py
    params:
      - seed
      - monitoring.reference_split
      - monitoring.reference_sample_rows
    outs:
      - data/monitoring/reference.parquet
    metrics:
      - reports/monitoring_reference.json:
          cache: false
  evaluate:
    cmd: python -m fraud.models.evaluate
    deps:
      - data/models/pipeline.joblib
      - data/processed/train.parquet
      - data/processed/valid.parquet
      - src/fraud/features/pipeline.py
      - src/fraud/models/metrics.py
      - src/fraud/models/evaluate.py
    params:
      - model.fn_cost
      - model.fp_cost
    plots:
      - reports/pr_curve.json:
          cache: false
          x: recall
          y: precision
    metrics:
      - reports/evaluate_metrics.json:
          cache: false
  ulb_ingest:
    cmd: python -m fraud.ulb.data ingest
    params:
      - ulb.kaggle_dataset
      - ulb.expected_files
    outs:
      - data/raw/ulb
  ulb_split:
    cmd: python -m fraud.ulb.data split
    deps:
      - data/raw/ulb
      - src/fraud/ulb/data.py
    params:
      - ulb.split
    outs:
      - data/processed_ulb
    metrics:
      - reports/ulb_split_summary.json:
          cache: false
  ulb_train:
    cmd: python -m fraud.ulb.train
    deps:
      # Train and valid only: the ULB test split is scored once, by fraud.ulb.evaluate_test.
      - data/processed_ulb/train.parquet
      - data/processed_ulb/valid.parquet
      - src/fraud/ulb/features.py
      - src/fraud/ulb/train.py
      - src/fraud/models/metrics.py
      - src/fraud/models/calibrate.py
      - src/fraud/models/estimator.py
      - src/fraud/models/ladder.py
    params:
      - seed
      - ulb
    outs:
      - data/models/ulb_pipeline.joblib
    metrics:
      - reports/ulb_ladder.json:
          cache: false
