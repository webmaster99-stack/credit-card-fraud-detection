name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For api/'s Postgres-backed tests (tests/test_api_db.py, tests/test_api_main.py); they skip
      # cleanly without TEST_DATABASE_URL, but CI always has it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fraud:fraud@localhost:5432/fraud
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src api
      - run: uv run pytest

  build-api-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false

  deploy-api:
    # Render's free tier has no API for a scoped deploy trigger; a deploy hook URL (created once
    # in the Render dashboard, stored as the RENDER_DEPLOY_HOOK_URL secret) is its documented
    # lightweight alternative. It redeploys whatever's on the connected branch, so this job's only
    # job is to fire it after a tag's image has proven it builds and its tests pass.
    runs-on: ubuntu-latest
    needs: build-api-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy trigger." >&2
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
