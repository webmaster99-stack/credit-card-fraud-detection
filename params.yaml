# Every tunable value lives here. No magic numbers in code.
seed: 42

dataset:
  name: sparkov
  version: v1

split:
  train_start: "2019-01-01"
  train_end: "2020-06-30"
  valid_start: "2020-07-01"
  valid_end: "2020-09-30"
  test_start: "2020-10-01"
  test_end: "2020-12-31"

mlflow:
  experiment_name: fraud-detection

ingest:
  kaggle_dataset: kartik2112/fraud-detection
  expected_files:
    - fraudTrain.csv
    - fraudTest.csv

clean:
  # Salt for the card_id hash. Not a secret: Sparkov is simulated, and the hash only keeps the
  # raw card number out of every downstream table.
  card_id_salt: sparkov-v1
  card_id_length: 16
  # Direct identifiers removed from the data. cc_num is replaced by card_id, not simply dropped.
  identifier_columns: [first, last, street, trans_num]
  # Redundant or misleading. unix_time is the timestamp shifted back exactly 7 years.
  redundant_columns: ["Unnamed: 0", unix_time]
  merchant_prefix: "fraud_"

features:
  # Night = [night_start_hour, 24) plus [0, night_end_hour). EDA: 84.8% of frauds fall in 22:00-03:59.
  night_start_hour: 22
  night_end_hour: 4
  # Velocity windows (hours) for the v2 history features: 1 h, 24 h, 7 d.
  velocity_windows_hours: [1, 24, 168]
  # Imputation of "no history yet" values (first transaction of a card), fitted on train only.
  impute_strategy: median

model:
  # Deterministic config for the `train`/`evaluate` dvc.yaml stages: the current pick from the Phase 3
  # ladder (docs/plan.md). Updated as ladder steps are run; see reports/model_ladder.json for the
  # full comparison. Champion candidate after the v1-vs-v2 comparison (protocol step 4): lightgbm on
  # v2 (history) features, recall 0.990 at precision 0.50 (vs xgboost v2 0.986, and both far above
  # their v1 versions: xgboost v1 0.921, lightgbm v1 0.915). History features are clearly worth it.
  # Still provisional pending the single test-set evaluation. NOTE: Phase 4's Gradio demo ships the
  # v1 stateless pipeline first regardless (docs/plan.md Phase 4 guardrails) - v2 needs the online
  # card-history store that Phase 5 builds.
  step: lightgbm
  feature_set: v2
  hyperparams:
    n_estimators: 450
    num_leaves: 126
    learning_rate: 0.0357166784849149
    min_child_samples: 74
    subsample: 0.5956307000059569
    colsample_bytree: 0.6922798918828642
    scale_pos_weight: 5.5404060794248595
  # "sigmoid" (Platt), "isotonic", or "none".
  calibration: sigmoid
  # False-alarm budget from CLAUDE.md: at most one false alarm per caught fraud.
  min_precision: 0.50
  # Expected-cost weighting (docs/plan.md Phase 3): a missed fraud costs 20x a false alarm.
  fn_cost: 20.0
  fp_cost: 1.0

demo_model:
  # The Phase 4 demo ships the v1 STATELESS pipeline (docs/plan.md guardrail): a form or CSV row has
  # no card history, so the v2 champion cannot be served until Phase 5's history store exists. Same
  # shape as `model` above so `fraud.models.train --section demo_model` reuses the whole train path.
  # Config = the best v1 rung of the ladder (xgboost v1: recall 0.921 at precision 0.50 on
  # validation, reports/model_ladder.json). Registered under the `demo` alias; champion/challenger
  # stay untouched.
  step: xgboost
  feature_set: v1
  hyperparams:
    n_estimators: 350
    max_depth: 10
    learning_rate: 0.023771106051716496
    min_child_weight: 19
    subsample: 0.6199242313325556
    colsample_bytree: 0.576038831716926
    scale_pos_weight: 8.264496504035321
  calibration: sigmoid
  min_precision: 0.50
  fn_cost: 20.0
  fp_cost: 1.0

serving:
  # Registry alias the export script publishes (see demo_model above).
  registry_alias: demo
  hf_model_repo: ilian-hadzhidimitrov/fraud-classifier
  hf_space_repo: ilian-hadzhidimitrov/fraud-classifier-demo
  # CSV upload cap for the Gradio batch tab (docs/plan.md Phase 4 guardrails).
  max_batch_rows: 10000
  # Reasons shown per prediction (SHAP bar chart + plain text).
  top_k_reasons: 5
  # Batch tab: SHAP is computed only for flagged rows (docs/plan.md risk table), highest scores first,
  # and at most this many; the results table on screen shows at most `batch_display_rows` rows
  # (the downloadable CSV always has every row).
  batch_explain_rows: 500
  batch_display_rows: 500
  github_repo: https://github.com/webmaster99-stack/credit-card-fraud-detection
  # Real rows from the test split offered by the demo's "Try an example" button, per class. They are
  # only displayed and scored for illustration; nothing is evaluated or tuned on them.
  n_examples_per_class: 10

monitoring:
  # Reference window for drift: the validation split, sampled (docs/plan.md Phase 6). Never test.
  reference_split: valid
  reference_sample_rows: 50000
  # Minimum logged predictions in a day before that day's drift/flag-rate checks mean anything.
  min_rows_per_day: 50
  # Numeric inputs and derived columns compared against the reference (PSI + Wasserstein).
  numeric_features: [amt, city_pop, age, distance_km, hour]
  categorical_features: [category, gender, state]
  psi_bins: 10
  # PSI rule of thumb: < 0.1 stable, 0.1-0.25 moderate, > 0.25 major shift.
  psi_alert: 0.25
  # Alert when at least `drift_features_min` features drift on `drift_days` consecutive days.
  drift_features_min: 1
  drift_days: 3
  # Prediction drift: alert when the daily flag rate leaves [low, high] x the validation flag rate.
  flag_rate_low: 0.5
  flag_rate_high: 2.0
  # Data quality and service thresholds (fractions of requests).
  max_invalid_fraction: 0.005
  max_error_rate: 0.01
  # Performance: alert when recall on labelled predictions drops more than this vs the test recall.
  recall_drop_points: 0.10
  min_labels_for_performance: 30
  # Rows per side given to the Evidently HTML report. Its size (~4 MB) is the embedded JS bundle
  # and does not depend on this; sampling only cuts the job's runtime (44 s at 50k rows vs 15 s).
  report_sample_rows: 5000
  # Days of history the nightly job looks back over, and reports kept per kind in the table. Each
  # nightly report stores ~4 MB of Evidently HTML, and Neon's free tier is 0.5 GB: 14 keeps that
  # to ~57 MB uncompressed (Postgres compresses it further).
  lookback_days: 14
  keep_reports: 14

tune:
  # Optuna trials per tunable ladder step. Kept modest: DagsHub's free tier caps tracked experiments
  # on a private repo (docs/infra.md), and each trial is a nested MLflow run.
  n_trials: 25
  # Per-step overrides where the default above is badly wrong for that model's per-trial cost.
  # Measured once on the real train split (1.3M rows, v1 features, default hyperparams): random
  # forest ~410s/fit, xgboost ~75s/fit, lightgbm ~25s/fit. Random forest's budget is cut hardest so
  # a full ladder sweep stays on the order of an hour rather than several.
  n_trials_by_step:
    random_forest: 6
    logreg_interact: 12
    xgboost: 15
    isolation_forest: 10
