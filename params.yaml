# Every tunable value lives here. No magic numbers in code.
seed: 42

dataset:
  name: sparkov
  version: v1

split:
  train_start: "2019-01-01"
  train_end: "2020-06-30"
  valid_start: "2020-07-01"
  valid_end: "2020-09-30"
  test_start: "2020-10-01"
  test_end: "2020-12-31"

mlflow:
  experiment_name: fraud-detection

ingest:
  kaggle_dataset: kartik2112/fraud-detection
  expected_files:
    - fraudTrain.csv
    - fraudTest.csv

clean:
  # Salt for the card_id hash. Not a secret: Sparkov is simulated, and the hash only keeps the
  # raw card number out of every downstream table.
  card_id_salt: sparkov-v1
  card_id_length: 16
  # Direct identifiers removed from the data. cc_num is replaced by card_id, not simply dropped.
  identifier_columns: [first, last, street, trans_num]
  # Redundant or misleading. unix_time is the timestamp shifted back exactly 7 years.
  redundant_columns: ["Unnamed: 0", unix_time]
  merchant_prefix: "fraud_"

features:
  # Night = [night_start_hour, 24) plus [0, night_end_hour). EDA: 84.8% of frauds fall in 22:00-03:59.
  night_start_hour: 22
  night_end_hour: 4
  # Velocity windows (hours) for the v2 history features: 1 h, 24 h, 7 d.
  velocity_windows_hours: [1, 24, 168]
  # Imputation of "no history yet" values (first transaction of a card), fitted on train only.
  impute_strategy: median

model:
  # Deterministic config for the `train`/`evaluate` dvc.yaml stages: the current pick from the Phase 3
  # ladder (docs/plan.md). Updated as ladder steps are run; see reports/model_ladder.json for the
  # full comparison. Starts at step 0 (dummy) so the pipeline is valid before any real tuning.
  step: dummy
  feature_set: v1
  hyperparams: {}
  # "sigmoid" (Platt), "isotonic", or "none".
  calibration: sigmoid
  # False-alarm budget from CLAUDE.md: at most one false alarm per caught fraud.
  min_precision: 0.50
  # Expected-cost weighting (docs/plan.md Phase 3): a missed fraud costs 20x a false alarm.
  fn_cost: 20.0
  fp_cost: 1.0

tune:
  # Optuna trials per tunable ladder step. Kept modest: DagsHub's free tier caps tracked experiments
  # on a private repo (docs/infra.md), and each trial is a nested MLflow run.
  n_trials: 25
  # Per-step overrides where the default above is badly wrong for that model's per-trial cost.
  # Measured once on the real train split (1.3M rows, v1 features, default hyperparams): random
  # forest ~410s/fit, xgboost ~75s/fit, lightgbm ~25s/fit. Random forest's budget is cut hardest so
  # a full ladder sweep stays on the order of an hour rather than several.
  n_trials_by_step:
    random_forest: 6
    logreg_interact: 12
    xgboost: 15
    isolation_forest: 10
